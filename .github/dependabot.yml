version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      drizzle:
        patterns:
          - drizzle-orm
          - drizzle-kit
          - drizzle-zod
    ignore:
      - dependency-name: "drizzle-orm"
        versions: ["1.0.0-beta*", "1.0.0-rc*"]
      - dependency-name: "drizzle-kit"
        versions: ["1.0.0-beta*", "1.0.0-rc*"]
    open-pull-requests-limit: 5
